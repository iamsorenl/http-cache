[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "http-cache"
version = "0.2.0"
description = "Disk-cached HTTP GET with atomic writes, stdlib only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Soren Larsen" }]

[tool.setuptools]
packages = ["http_cache"]
